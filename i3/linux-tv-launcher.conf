# linux-tv-launcher: add these lines to ~/.config/i3/config
# (or put `include ~/linux-tv-launcher/i3/linux-tv-launcher.conf` in it, i3 4.20+).
# Adjust ~/linux-tv-launcher if you cloned it somewhere else.

# Start the launcher on login.
exec --no-startup-id ~/linux-tv-launcher/scripts/start.sh

# The launcher, and a Firefox it starts for an app, full screen without borders.
for_window [class="tvlauncher"] fullscreen enable, border none
for_window [class="tvapp"] fullscreen enable, border none

# Home: close the current app and go back to the launcher.
# Check what your remote's Home button sends with `xev` and use that key name.
bindsym XF86HomePage exec --no-startup-id ~/linux-tv-launcher/scripts/home.sh
bindsym $mod+Escape exec --no-startup-id ~/linux-tv-launcher/scripts/home.sh
